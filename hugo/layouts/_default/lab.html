{{ define "main" }}
<div class="wrap page-end">
  <header class="page-head">
    <h1>{{ .Title }}</h1>
    {{- with .Params.lede }}<p class="standfirst">{{ . }}</p>{{ end }}
  </header>
  <div class="section" style="padding-top:40px">
    <ul class="rows" style="border-top:2px solid var(--ink)">
      {{- range .Params.items }}
      <li><a class="row" href="{{ .url }}" rel="noopener">
        <div><span class="k">{{ .tag }}</span><h3>{{ .name }}</h3></div>
        <div class="summary"><p>{{ .text }}</p></div>
        <div class="result"><span class="fig" style="font-size:16px">{{ .year }}</span>{{ .url | replaceRE "^https?://" "" }}</div>
      </a></li>
      {{- end }}
    </ul>
  </div>
</div>
{{ end }}
