{{ define "main" }}
<section class="hero" data-enter>
  <div class="wrap"><div class="page-hero"><h1>{{ .Title }}</h1>{{ with .Params.lede }}<p class="t-lead">{{ . }}</p>{{ end }}</div></div>
</section>
<section class="body">
  <div class="wrap">
    <div class="field" data-org="independent">
      <div class="field-head"><h3>Tools and experiments</h3></div>
      <ul class="parts">
        {{- range .Params.items }}
        <li><a class="part" href="{{ .url }}" rel="noopener">
          <h4>{{ .name }}</h4>
          <p class="summary">{{ .text }}</p>
          <span class="spec"><b class="status">{{ .year }}</b>{{ .url | replaceRE "^https?://(www\\.)?" "" }}</span>
        </a></li>
        {{- end }}
      </ul>
    </div>
  </div>
</section>
{{ end }}
